<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: 'Arial', sans-serif;
  }
  #game-container {
    text-align: center;
    background: #16213e;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  h1 {
    color: #0f3460;
    margin-top: 0;
  }
  #score {
    color: #e94560;
    font-size: 24px;
    margin: 10px 0;
  }
  canvas {
    border: 2px solid #0f3460;
    background: #0a0a23;
    display: block;
    margin: 0 auto;
  }
  #game-over {
    margin-top: 15px;
    color: #e94560;
    font-size: 20px;
  }
  #game-over p {
    margin: 10px 0;
  }
  #restart-btn {
    padding: 10px 30px;
    font-size: 18px;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #restart-btn:hover {
    background: #c7365a;
  }
</style>
</head>
<body>
<div id="game-container">
  <h1>🐍 贪吃蛇</h1>
  <div id="score">得分: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="game-over" style="display:none;">
    <p>游戏结束！得分: <span id="final-score">0</span></p>
    <button id="restart-btn">重新开始</button>
  </div>
</div>
<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('score');
  const gameOverDiv = document.getElementById('game-over');
  const finalScoreSpan = document.getElementById('final-score');
  const restartBtn = document.getElementById('restart-btn');

  const GRID_SIZE = 20;       // 网格数量（每边）
  const CELL_SIZE = 20;       // 像素
  const TICK_INTERVAL = 150;  // 毫秒

  let snake = [];
  let food = {};
  let direction = 'right';    // 当前方向
  let nextDirection = 'right';
  let score = 0;
  let gameRunning = false;
  let gameInterval = null;

  // 初始化游戏
  function init() {
    const startX = Math.floor(GRID_SIZE / 2);
    const startY = Math.floor(GRID_SIZE / 2);
    snake = [
      { x: startX, y: startY },
      { x: startX - 1, y: startY },
      { x: startX - 2, y: startY }
    ];
    direction = 'right';
    nextDirection = 'right';
    score = 0;
    scoreDisplay.textContent = '得分: 0';
    gameOverDiv.style.display = 'none';
    generateFood();
    gameRunning = true;
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameTick, TICK_INTERVAL);
  }

  // 生成食物（不在蛇身上）
  function generateFood() {
    const totalCells = GRID_SIZE * GRID_SIZE;
    if (snake.length >= totalCells) {
      // 胜利（不可能？但处理一下）
      gameOver(true);
      return;
    }
    let freeCells = [];
    for (let i = 0; i < GRID_SIZE; i++) {
      for (let j = 0; j < GRID_SIZE; j++) {
        if (!snake.some(seg => seg.x === i && seg.y === j)) {
          freeCells.push({ x: i, y: j });
        }
      }
    }
    const rand = Math.floor(Math.random() * freeCells.length);
    food = freeCells[rand];
  }

  // 游戏逻辑更新
  function gameTick() {
    if (!gameRunning) return;
    direction = nextDirection;

    // 计算新蛇头
    let newHead = { ...snake[0] };
    switch (direction) {
      case 'up':    newHead.y -= 1; break;
      case 'down':  newHead.y += 1; break;
      case 'left':  newHead.x -= 1; break;
      case 'right': newHead.x += 1; break;
    }

    // 检查撞墙
    if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
      gameOver(false);
      return;
    }

    // 检查撞自身（新蛇头与旧蛇身碰撞，注意如果吃到食物蛇尾不删除则要包含尾部）
    // 先假设没吃到食物，检测 snake（不含尾）
    let willEat = (newHead.x === food.x && newHead.y === food.y);
    let bodyToCheck = willEat ? snake : snake.slice(0, -1);  // 如果吃食物，蛇身长度+1，尾部不删除，所以尾部也算障碍
    if (bodyToCheck.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
      gameOver(false);
      return;
    }

    // 移动蛇
    snake.unshift(newHead);
    if (willEat) {
      score += 10;
      scoreDisplay.textContent = '得分: ' + score;
      generateFood();
    } else {
      snake.pop();
    }

    draw();
  }

  // 游戏结束
  function gameOver(win) {
    gameRunning = false;
    if (gameInterval) {
      clearInterval(gameInterval);
      gameInterval = null;
    }
    finalScoreSpan.textContent = score;
    gameOverDiv.style.display = 'block';
  }

  // 绘制
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制网格线（可选）
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL_SIZE, 0);
      ctx.lineTo(i * CELL_SIZE, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL_SIZE);
      ctx.lineTo(canvas.width, i * CELL_SIZE);
      ctx.stroke();
    }

    // 绘制蛇
    snake.forEach((seg, index) => {
      ctx.fillStyle = index === 0 ? '#00ff88' : '#00cc66';
      ctx.fillRect(seg.x * CELL_SIZE + 1, seg.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
    });

    // 绘制食物
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(food.x * CELL_SIZE + CELL_SIZE/2, food.y * CELL_SIZE + CELL_SIZE/2, CELL_SIZE/2 - 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // 键盘事件
  document.addEventListener('keydown', function(e) {
    if (!gameRunning) return;
    const key = e.key;
    // 阻止页面滚动
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
      e.preventDefault();
    }
    switch (key) {
      case 'ArrowUp':    if (direction !== 'down')  nextDirection = 'up'; break;
      case 'ArrowDown':  if (direction !== 'up')    nextDirection = 'down'; break;
      case 'ArrowLeft':  if (direction !== 'right') nextDirection = 'left'; break;
      case 'ArrowRight': if (direction !== 'left')  nextDirection = 'right'; break;
    }
  });

  // 重启按钮
  restartBtn.addEventListener('click', function() {
    init();
    draw();
  });

  // 开始游戏
  init();
  draw();
})();
</script>
</body>
</html>
