<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2048</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica Neue,sans-serif;background:#faf8ef;display:flex;justify-content:center;align-items:center;min-height:100vh;user-select:none;touch-action:manipulation}
.container{width:100%;max-width:420px;padding:12px 16px}
@media(min-width:440px){.container{padding:20px}}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:clamp(36px,12vw,60px);font-weight:700;color:#776e65;line-height:1}
.header-right{display:flex;align-items:center;gap:10px}
.score-box{background:#bbada0;border-radius:6px;padding:8px 20px;text-align:center;min-width:80px}
.score-box .label{font-size:11px;text-transform:uppercase;color:#eee4da;letter-spacing:1px}
.score-box .value{font-size:clamp(18px,6vw,24px);font-weight:700;color:#fff}
.btn-new,.btn-undo{background:#8f7a66;border:none;border-radius:6px;color:#f9f6f2;font-weight:700;cursor:pointer;transition:background .15s}
.btn-new,.btn-undo{font-size:clamp(13px,4vw,15px);padding:8px 14px}
@media(min-width:440px){.btn-new,.btn-undo{font-size:15px;padding:10px 20px}}
.btn-new:hover,.btn-undo:hover{background:#7a6a5b}
.btn-new:active,.btn-undo:active{transform:scale(.96)}
.info{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:#776e65}
.info .status{font-weight:700}
.board{position:relative;width:100%;aspect-ratio:1;background:#bbada0;border-radius:8px;padding:10px;display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr);gap:10px}
.cell{background:rgba(238,228,218,.35);border-radius:6px}
.tiles-layer{position:absolute;top:10px;left:10px;right:10px;bottom:10px;pointer-events:none}
.tile{position:absolute;border-radius:6px;display:flex;justify-content:center;align-items:center;font-weight:700;z-index:10;will-change:transform;transition:top .12s ease,left .12s ease;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tile-new{z-index:20;animation:pop .2s ease}
.tile-merge{z-index:15;animation:mergePop .25s ease}
@keyframes pop{0%{transform:scale(0);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes mergePop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes scoreBump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.score-bump{animation:scoreBump .3s ease}
.score-float{position:absolute;font-weight:700;font-size:18px;color:#776e65;pointer-events:none;z-index:50;animation:floatUp .7s ease forwards}
.best-label{font-size:9px;text-transform:uppercase;color:#eee4da;letter-spacing:.5px}
.best-value{font-size:16px;font-weight:700;color:#fff}
.tile-2{background:#eee4da;color:#776e65}
.tile-4{background:#ede0c8;color:#776e65}
.tile-8{background:#f2b179;color:#f9f6f2}
.tile-16{background:#f59563;color:#f9f6f2}
.tile-32{background:#f67c5f;color:#f9f6f2}
.tile-64{background:#f65e3b;color:#f9f6f2}
.tile-128{background:#edcf72;color:#f9f6f2;box-shadow:0 0 12px rgba(237,207,114,.5)}
.tile-256{background:#edcc61;color:#f9f6f2;box-shadow:0 0 14px rgba(237,204,97,.55)}
.tile-512{background:#edc850;color:#f9f6f2;box-shadow:0 0 16px rgba(237,200,80,.6)}
.tile-1024{background:#edc53f;color:#f9f6f2;box-shadow:0 0 18px rgba(237,197,63,.7)}
.tile-2048{background:#edc22e;color:#f9f6f2;box-shadow:0 0 22px rgba(237,194,46,.8)}
.tile-4096{background:#5fba7d;color:#f9f6f2;box-shadow:0 0 24px rgba(95,186,125,.6);font-size:40px!important}
.tile-8192{background:#457b9d;color:#f9f6f2;box-shadow:0 0 26px rgba(69,123,157,.6);font-size:36px!important}
.tile-super{background:#3c3a32;color:#f9f6f2;box-shadow:0 0 28px rgba(60,58,50,.6);font-size:30px!important}
.overlay{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(238,228,218,.73);border-radius:8px;z-index:100;flex-direction:column;justify-content:center;align-items:center;gap:16px}
.overlay.show{display:flex}
.overlay .title{font-size:50px;font-weight:700;color:#776e65}
.overlay .sub{font-size:16px;color:#776e65}
.overlay .btn-retry,.overlay .btn-continue{font-size:18px;padding:12px 30px}
.overlay .btn-continue{background:#8f7a66;border:none;border-radius:6px;color:#f9f6f2;font-weight:700;cursor:pointer;transition:background .15s}
.overlay .btn-continue:hover{background:#7a6a5b}
.shake{animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.swipe-indicator{position:absolute;top:50%;left:50%;font-size:48px;color:rgba(119,110,101,.3);z-index:30;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .15s,transform .15s}
.swipe-indicator.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.info-item{margin:0 4px;white-space:nowrap}
.footer{margin-top:16px;text-align:center;font-size:12px;color:#776e65}
.footer .hint{font-size:13px;margin-bottom:6px}
@media(max-width:420px){
  .container{width:100%;padding:12px}
  h1{font-size:40px}
  .score-box{padding:6px 14px;min-width:60px}
  .score-box .value{font-size:20px}
  .btn-new{font-size:13px;padding:8px 14px}
  .board{padding:8px;gap:8px}
  .tiles-layer{top:8px;left:8px;right:8px;bottom:8px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>2048</h1>
    <div class="header-right">
      <div class="score-box">
        <div class="label">得分</div>
        <div class="value" id="scoreDisplay">0</div>
      </div>
      <div class="score-box">
        <div class="best-label">最高</div>
        <div class="best-value" id="bestDisplay">0</div>
      </div>
      <button class="btn-undo" id="btnUndo" title="Ctrl+Z">↩ 撤回</button>
      <button class="btn-new" id="btnNew">新游戏</button>
    </div>
  </div>
  <div class="info">
    <span class="info-item">步数 <b id="moveDisplay">0</b></span>
    <span class="info-item">最高 <b id="maxTileDisplay">-</b></span>
    <span class="status" id="statusDisplay">▶ 游戏中</span>
  </div>
  <div class="board" id="board">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="tiles-layer" id="tilesLayer"></div>
    <div class="swipe-indicator" id="swipeIndicator">⬆</div>
    <div class="overlay" id="overlay">
      <div class="title" id="overlayTitle">游戏结束</div>
      <div class="sub" id="overlaySub">得分：0</div>
      <div class="sub-hint" id="overlayHint" style="font-size:13px;color:#998a7e;margin-top:-8px"></div>
      <div style="display:flex;gap:12px">
        <button class="btn-retry" id="btnRetry">再来一局</button>
        <button class="btn-continue" id="btnContinue" style="display:none">继续游戏</button>
      </div>
    </div>
  </div>
  <div class="footer">
    <div class="hint">← ↑ → ↓ / WASD / 滑动  ·  Z 撤回  ·  R 重启  ·  自动存档</div>
  </div>
</div>
<script>
(function(){
'use strict';

const S = 4, G = 10, P = 10;

const $ = id => document.getElementById(id);
const boardEl = $('board');
const tilesLayer = $('tilesLayer');
const scoreDisplay = $('scoreDisplay');
const bestDisplay = $('bestDisplay');
const statusDisplay = $('statusDisplay');
const moveDisplay = $('moveDisplay');
const maxTileDisplay = $('maxTileDisplay');
const swipeIndicator = $('swipeIndicator');
const overlay = $('overlay');
const overlayTitle = $('overlayTitle');
const overlaySub = $('overlaySub');
const overlayHint = $('overlayHint');
const btnRetry = $('btnRetry');
const btnContinue = $('btnContinue');

let grid, score, gameOver, gameWon, keepPlaying;
let bestScore = +localStorage.getItem('b2048')||0;
let undoGrid, undoScore, undoMoveCount;
let moveCount = 0, maxTile = 0;

function emptyGrid(){
  return Array.from({length:S},()=>Array(S).fill(0));
}

let _tileSz = 0;
function computeTileSz(){
  _tileSz = (boardEl.getBoundingClientRect().width - P*2 - G*(S-1)) / S;
}

function tileClass(val){
  if(val<=2048) return 'tile-'+val;
  if(val<=4096) return 'tile-4096';
  if(val<=8192) return 'tile-8192';
  return 'tile-super';
}
function fontSizeFor(val){
  const len = String(val).length;
  if(len>5) return 20;
  if(len>4) return 26;
  return Math.max(26, 55 - (len-1)*5);
}

function posToPx(r,c){
  const sz = _tileSz + G;
  return {top:r*sz, left:c*sz};
}

function render(newKeys, mergeKeys, fromMap){
  const nk = new Set(newKeys), mk = new Set(mergeKeys);
  computeTileSz();
  tilesLayer.innerHTML='';
  for(let r=0;r<S;r++){
    for(let c=0;c<S;c++){
      const val = grid[r][c];
      if(val===0) continue;
      const {top,left}=posToPx(r,c);
      const key = r+','+c;
      const div = document.createElement('div');
      div.className = 'tile '+tileClass(val);
      div.style.cssText = `width:${_tileSz}px;height:${_tileSz}px;top:${top}px;left:${left}px;font-size:${fontSizeFor(val)}px`;
      div.textContent = val;
      if(nk.has(key)) div.classList.add('tile-new');
      if(mk.has(key)) div.classList.add('tile-merge');
      // slide animation from fromMap
      if(!nk.has(key) && !mk.has(key) && fromMap && fromMap[key]){
        const [pr,pc] = fromMap[key].split(',').map(Number);
        const o = posToPx(pr,pc);
        div.style.top=o.top+'px';
        div.style.left=o.left+'px';
        requestAnimationFrame(()=>{
          div.style.top=top+'px';
          div.style.left=left+'px';
        });
      }
      tilesLayer.appendChild(div);
    }
  }
}

function addRandomTile(){
  const empty = [];
  for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(grid[r][c]===0) empty.push([r,c]);
  if(empty.length===0) return null;
  const [r,c] = empty[Math.random()*empty.length|0];
  grid[r][c] = Math.random()<.9 ? 2 : 4;
  return r+','+c;
}

function canMove(){
  for(let r=0;r<S;r++) for(let c=0;c<S;c++){
    if(grid[r][c]===0) return true;
    if(c+1<S && grid[r][c]===grid[r][c+1]) return true;
    if(r+1<S && grid[r][c]===grid[r+1][c]) return true;
  }
  return false;
}

function persistState(){
  try {
    localStorage.setItem('b2048_state', JSON.stringify({grid,score,undoGrid,undoScore,undoMoveCount,moveCount,maxTile,gameOver,gameWon,keepPlaying}));
  } catch(e){}
}
function loadState(){
  try {
    const raw = localStorage.getItem('b2048_state');
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s.grid||s.grid.length!==S) return false;
    grid=s.grid; score=+s.score||0; gameOver=!!s.gameOver; gameWon=!!s.gameWon; keepPlaying=!!s.keepPlaying;
    moveCount=+s.moveCount||0; maxTile=+s.maxTile||0;
    undoGrid=s.undoGrid||null; undoScore=+s.undoScore||0; undoMoveCount=+s.undoMoveCount||0;
    scoreDisplay.textContent=score; moveDisplay.textContent=moveCount;
    maxTileDisplay.textContent=maxTile||'-';
    statusDisplay.textContent=gameOver?'💀 游戏结束':(gameWon&&!keepPlaying?'🏆 你赢了！':'▶ 游戏中');
    return true;
  } catch(e){}
}

function slideRow(row){
  const items = [];
  for(let i=0;i<row.length;i++) if(row[i]) items.push({val:row[i], col:i});
  const m = [];
  const at = [];
  const origins = [];
  let gain = 0;
  let i = 0;
  while(i < items.length){
    if(i+1<items.length && items[i].val===items[i+1].val){
      const v = items[i].val*2;
      m.push(v);
      origins.push([items[i].col, items[i+1].col]);
      at.push(m.length-1);
      gain += v;
      i+=2;
    } else {
      m.push(items[i].val);
      origins.push([items[i].col]);
      i++;
    }
  }
  while(m.length<S){ m.push(0); origins.push([]); }
  return {merged:m, scoreGain:gain, mergeAt:at, origins};
}

function move(dir){
  if(gameOver) return false;

  // save undo state
  undoGrid = grid.map(r=>[...r]);
  undoScore = score;
  undoMoveCount = moveCount;

  let work = grid.map(r=>[...r]);
  let rotated = false, rev = false;

  if(dir===0){
    work = work[0].map((_,i)=>work.map(r=>r[i]));
    rotated = true;
  } else if(dir===2){
    work = work[0].map((_,i)=>work.map(r=>r[i]));
    work = work.map(r=>r.reverse());
    rotated = true;
    rev = true;
  } else if(dir===1){
    work = work.map(r=>r.reverse());
    rev = true;
  }

  const workMergeCoords = [];
  const workOrigins = [];
  let changed = false, totalGain = 0;

  const newWork = work.map((row, rIdx)=>{
    const {merged,scoreGain,mergeAt,origins} = slideRow(row);
    for(let i=0;i<S;i++) if(merged[i]!==row[i]) changed=true;
    totalGain += scoreGain;
    for(const c of mergeAt) workMergeCoords.push({r:rIdx, c});
    for(let c=0;c<S;c++){
      for(const srcCol of origins[c]){
        if(srcCol!==c) workOrigins.push({workR:rIdx, fromCol:srcCol, toCol:c});
      }
    }
    return merged;
  });

  if(!changed){
    undoGrid = null; // don't save no-op
    return false;
  }

  const mergeKeys = workMergeCoords.map(({r,c})=>{
    let gr=r, gc=c;
    if(rev) gc = S-1-gc;
    if(rotated){ const t=gr; gr=gc; gc=t; }
    return gr+','+gc;
  });

  // Build fromMap for reliable slide animation
  const fromMap = {};
  for(const {workR, fromCol, toCol} of workOrigins){
    let sr=workR, sc=fromCol;
    if(rev) sc = S-1-sc;
    if(rotated){ const t=sr; sr=sc; sc=t; }
    const fromKey = sr+','+sc;
    let dr=workR, dc=toCol;
    if(rev) dc = S-1-dc;
    if(rotated){ const t=dr; dr=dc; dc=t; }
    fromMap[dr+','+dc] = fromKey;
  }

  if(rev) newWork.forEach(r=>r.reverse());
  if(rotated){
    const tmp = newWork[0].map((_,i)=>newWork.map(r=>r[i]));
    newWork.length=0;
    newWork.push(...tmp);
  }

  grid = newWork;
  score += totalGain;
  scoreDisplay.textContent = score;
  // score bump
  scoreDisplay.classList.remove('score-bump');
  void scoreDisplay.offsetWidth;
  scoreDisplay.classList.add('score-bump');
  // score float
  if(totalGain>0){
    const floatEl = document.createElement('div');
    floatEl.className = 'score-float';
    floatEl.textContent = '+'+totalGain;
    const rect = scoreDisplay.getBoundingClientRect();
    const boardRect = boardEl.getBoundingClientRect();
    floatEl.style.left = (rect.left - boardRect.left + rect.width/2 - 15) + 'px';
    floatEl.style.top = (rect.top - boardRect.top - 5) + 'px';
    boardEl.appendChild(floatEl);
    setTimeout(()=>floatEl.remove(), 700);
  }
  // best score
  if(score>bestScore){
    bestScore=score;
    bestDisplay.textContent=score;
    localStorage.setItem('b2048',score);
  }

  const newKey = addRandomTile();
  const newKeys = newKey ? [newKey] : [];

  let wonThisTurn = false;
  if(!gameWon){
    for(let r=0;r<S;r++) for(let c=0;c<S;c++){
      if(grid[r][c]>=2048){ gameWon=true; wonThisTurn=true; break; }
    }
  }

  if(wonThisTurn && !keepPlaying){
    statusDisplay.textContent = '🏆 你赢了！';
    showOverlay('你赢了！','得分：'+score, true);
  }

  if(!canMove()){
    gameOver = true;
    statusDisplay.textContent = '💀 游戏结束';
    const gap = bestScore > score ? '离最高分差 '+(bestScore-score) : '🎉 新纪录！';
    showOverlay('游戏结束','得分：'+score+'　'+gap, false);
  }

  render(newKeys, mergeKeys, fromMap);

  moveCount++;
  moveDisplay.textContent = moveCount;
  // track max tile
  for(let r=0;r<S;r++) for(let c=0;c<S;c++){
    if(grid[r][c]>maxTile){ maxTile=grid[r][c]; maxTileDisplay.textContent=maxTile; }
  }
  persistState();
  return true;
}

function showOverlay(title, sub, win){
  overlayTitle.textContent = title;
  overlaySub.textContent = sub;
  overlayHint.textContent = win ? '按 Z / Ctrl+Z 可撤回一步再继续' : (undoGrid ? '按 Z 或点击撤回可回退一步' : '');
  overlay.classList.add('show');
  btnRetry.style.display = win ? 'none' : '';
  btnContinue.style.display = win ? '' : 'none';
  btnRetry._win = win;
}

function hideOverlay(){
  overlay.classList.remove('show');
}

function handleRetry(){
  hideOverlay();
  if(btnRetry._win){
    keepPlaying = true;
    statusDisplay.textContent = '▶ 继续中';
  } else newGame();
}

function handleContinue(){
  hideOverlay();
  keepPlaying = true;
  statusDisplay.textContent = '▶ 继续中';
}

function isInputBlocked(){
  return overlay.classList.contains('show') && gameOver;
}

const SWIPE_ARROWS = ['⬆','➡','⬇','⬅'];
function showSwipeIndicator(dir){
  swipeIndicator.textContent = SWIPE_ARROWS[dir];
  swipeIndicator.classList.remove('show');
  void swipeIndicator.offsetWidth;
  swipeIndicator.classList.add('show');
  clearTimeout(swipeIndicator._t);
  swipeIndicator._t = setTimeout(()=>swipeIndicator.classList.remove('show'), 250);
}
function shakeBoard(){
  boardEl.classList.remove('shake');
  void boardEl.offsetWidth;
  boardEl.classList.add('shake');
  setTimeout(()=>boardEl.classList.remove('shake'), 400);
}

document.addEventListener('keydown',e=>{
  // undo: Ctrl+Z 或单独 Z
  if(e.key==='z'||e.key==='Z'){
    if(e.ctrlKey||e.metaKey) e.preventDefault();
    if(!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); doUndo(); return; }
    if(e.ctrlKey||e.metaKey){ e.preventDefault(); doUndo(); return; }
  }
  // restart: R
  if(e.key==='r'||e.key==='R'){
    if(!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); newGame(); return; }
  }
  const map = {ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3};
  const d = map[e.key];
  if(d===undefined) return;
  e.preventDefault();
  if(isInputBlocked()) return;
  if(overlay.classList.contains('show') && gameWon && !gameOver){
    hideOverlay();
    keepPlaying = true;
    statusDisplay.textContent = '▶ 继续中';
  }
  if(!move(d)) shakeBoard();
  else if(navigator.vibrate) navigator.vibrate(10);
});

let startX, startY;
boardEl.addEventListener('touchstart',e=>{
  if(isInputBlocked()) return;
  const t = e.touches[0];
  startX = t.clientX;
  startY = t.clientY;
},{passive:true});

boardEl.addEventListener('touchmove',e=>{
  if(startX!==undefined) e.preventDefault();
},{passive:false});

boardEl.addEventListener('touchend',e=>{
  if(isInputBlocked()){ startX=startY=undefined; return; }
  if(startX===undefined) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - startX;
  const dy = t.clientY - startY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20){ startX=startY=undefined; return; }
  const dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?1:3) : (dy>0?2:0);
  showSwipeIndicator(dir);
  if(overlay.classList.contains('show') && gameWon && !gameOver){
    hideOverlay();
    keepPlaying = true;
    statusDisplay.textContent = '▶ 继续中';
  }
  if(!move(dir)) shakeBoard();
  else if(navigator.vibrate) navigator.vibrate(10);
  startX = startY = undefined;
},{passive:true});

function newGame(){
  grid = emptyGrid();
  score = 0;
  gameOver = false;
  gameWon = false;
  keepPlaying = false;
  undoGrid = null;
  moveCount = 0;
  maxTile = 0;
  scoreDisplay.textContent = '0';
  moveDisplay.textContent = '0';
  maxTileDisplay.textContent = '-';
  bestDisplay.textContent = bestScore;
  statusDisplay.textContent = '▶ 游戏中';
  hideOverlay();
  localStorage.removeItem('b2048_state');
  const k1 = addRandomTile();
  const k2 = addRandomTile();
  render([k1,k2].filter(Boolean), []);
}

function doUndo(){
  if(!undoGrid) return;
  if(gameOver){
    gameOver = false;
    hideOverlay();
    statusDisplay.textContent = '↩ 已撤回，继续游戏';
  }
  grid=undoGrid; score=undoScore; moveCount=undoMoveCount;
  scoreDisplay.textContent=score; moveDisplay.textContent=moveCount;
  // recalc maxTile from grid
  maxTile=0;
  for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(grid[r][c]>maxTile) maxTile=grid[r][c];
  maxTileDisplay.textContent=maxTile||'-';
  undoGrid=null;
  persistState();
  render([],[]);
}
$('btnNew').addEventListener('click', newGame);
$('btnUndo').addEventListener('click', doUndo);
btnRetry.addEventListener('click', handleRetry);
btnContinue.addEventListener('click', handleContinue);

const ro = new ResizeObserver(()=>requestAnimationFrame(()=>render([],[])));
ro.observe(boardEl);

if(!loadState()) newGame();
})();
</script>
</body>
</html>
